name: Build and Attach JAR to Release

on:
  # Trigger when you publish a release from the GitHub UI
  release:
    types: [published]

  # Optional: allow manual runs from the Actions tab
  workflow_dispatch: {}

# Needed so the workflow can upload assets to the release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # Optional: keep artifacts for debugging / download from Actions
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rusherchatserver-jars
          path: build/libs/*.jar

      - name: Upload JAR to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Use the tag of the release that triggered this workflow
          tag_name: ${{ github.event.release.tag_name }}
          files: build/libs/*.jar
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
