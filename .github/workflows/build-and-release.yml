name: Build and Release RusherChatServer

on:
  # Runs automatically whenever you push a tag like v1.0.0
  push:
    tags:
      - "v*.*.*"

  # Optional: let you run the build manually from the Actions tab
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rusherchatserver-jars
          path: build/libs/*.jar

      # Only create a GitHub Release when this run was triggered by a tag
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "RusherChatServer ${{ github.ref_name }}"
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
