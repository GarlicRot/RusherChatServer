name: Build and Attach Server JAR to Release

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build (fat jar)
        run: ./gradlew clean build -x test

      - name: Show built files
        run: ls -la build/libs

      - name: Pick release JAR
        id: pick
        shell: bash
        run: |
          set -euo pipefail

          # Prefer shadow/fat jar naming conventions if present
          jar="$(ls -1 build/libs/*-all.jar 2>/dev/null | head -n 1 || true)"
          if [ -z "$jar" ]; then
            # Fallback: pick a single non-sources jar
            jar="$(ls -1 build/libs/*.jar 2>/dev/null | grep -vE '(-sources|-javadoc)\.jar$' | head -n 1 || true)"
          fi

          if [ -z "$jar" ]; then
            echo "No suitable jar found in build/libs"
            exit 1
          fi

          echo "Selected jar: $jar"
          echo "jar_path=$jar" >> "$GITHUB_OUTPUT"

      - name: Upload JAR to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ steps.pick.outputs.jar_path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
